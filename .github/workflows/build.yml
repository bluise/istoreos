name: 构建 iStoreOS 精简版镜像

# 触发方式：
#   1. 推送到 master（只改 recipe/ files/ 或本工作流时）—— 自动构建，不用手点
#   2. 每天定时检查官方是否有新版；版本没变就整轮跳过，省时间也不刷屏
#   3. 手动 Run workflow —— 参数都可以留空（留空=自动去官方 OTA 清单找当前最新镜像）
# 构建产物：精简 img.gz + 校验和 + OTA 清单，发布到 Release，且**只保留最新一个**
on:
  workflow_dispatch:
    inputs:
      upstream_url:
        description: '官方镜像 URL；留空=自动从官方 OTA 清单取“当前最新”（推荐留空）'
        required: false
        default: ''
      openclash_version:
        description: 'OpenClash 版本（上游 vernesong/OpenClash）'
        required: true
        default: '0.47.156'
      ddns_go_version:
        description: 'DDNS-GO 版本（上游 jeessy2/ddns-go）'
        required: true
        default: '6.17.7'
      use_oaf_v7:
        description: '把 OAF 升级到 v7（内核不匹配会自动跳过）'
        type: boolean
        default: true
      make_release:
        description: '构建成功后创建 Release（否则只上传 artifact）'
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - 'recipe/**'
      - 'files/**'
      - '.github/workflows/build.yml'
  schedule:
    # 每天 20:10 UTC = 北京时间 04:10 检查一次上游
    - cron: '10 20 * * *'

permissions:
  contents: write

env:
  # 非 workflow_dispatch 触发时 inputs.* 是空的，这里统一给默认值
  OPENCLASH_VERSION: ${{ inputs.openclash_version || '0.47.156' }}
  DDNS_GO_VERSION: ${{ inputs.ddns_go_version || '6.17.7' }}
  USE_OAF_V7: ${{ (github.event_name != 'workflow_dispatch' || inputs.use_oaf_v7) && 'true' || 'false' }}
  MAKE_RELEASE: ${{ (github.event_name != 'workflow_dispatch' || inputs.make_release) && 'true' || 'false' }}
  OFFICIAL_OTA_BASE: https://fw.koolcenter.com/iStoreOS/x86_64_efi

jobs:
  # 定时触发时先看看官方是否真出了新版，没变就不折腾
  check:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          UP=""; CUR=""
          # 官方清单第一行形如 [25.12.5-2026091113](istoreos-....img.gz)
          UP=$(curl -fsSL --retry 3 "$OFFICIAL_OTA_BASE/version.latest.v2" 2>/dev/null | head -1 \
               | sed -nE 's/^\[([^]]+)\].*/\1/p') || true
          URL=$(gh release view --json assets -q '.assets[] | select(.name=="upstream.ver") | .url' 2>/dev/null) || true
          if [ -n "$URL" ]; then
            CUR=$(gh api "$URL" -H "Accept: application/octet-stream" 2>/dev/null | head -1) || true
          fi
          echo "官方最新: ${UP:-<取不到>}"
          echo "本仓库最新: ${CUR:-<无 Release>}"
          if [ -n "$UP" ] && [ "$UP" = "$CUR" ]; then
            echo "官方版本没变，跳过本轮构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [check]
    # check 被跳过/失败(手动触发、取不到官方清单)时照样构建，只有定时轮明确判定"没变"才跳过
    if: ${{ always() && (github.event_name != 'schedule' || needs.check.outputs.skip != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools pigz curl python3

      - name: 下载 OpenClash（官方 release 的真 apk 包）
        run: |
          set -e
          V="$OPENCLASH_VERSION"
          U="https://github.com/vernesong/OpenClash/releases/download/v$V/luci-app-openclash-$V.apk"
          curl -fSL --retry 3 -o openclash.apk "$U" || curl -fSL --retry 3 -o openclash.apk "https://ghfast.top/$U"
          ls -l openclash.apk
          echo -n "包格式(magic 应为 ADBd): "; od -An -c -N4 openclash.apk | tr -s ' '

      - name: 下载 DDNS-GO（官方静态二进制）
        run: |
          set -e
          V="$DDNS_GO_VERSION"
          U="https://github.com/jeessy2/ddns-go/releases/download/v$V/ddns-go_${V}_linux_x86_64.tar.gz"
          curl -fSL --retry 3 -o ddns-go.tar.gz "$U" || curl -fSL --retry 3 -o ddns-go.tar.gz "https://ghfast.top/$U"
          tar tzf ddns-go.tar.gz

      - name: 构建精简镜像
        id: build
        run: |
          set -e
          # 版本号尾段：写进固件、同时用于 OTA 清单，每次构建都不一样，
          # 设备上的「系统 -> OTA」才会看到"有新版本"
          STAMP=$(date -u +%Y%m%d%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          if [ -n "${{ inputs.upstream_url }}" ]; then
            ARGS="--upstream-url '${{ inputs.upstream_url }}'"
          else
            ARGS=""   # 留空 -> 配方自己去官方 OTA 清单里找当前最新镜像
          fi
          ARGS="$ARGS --out iStoreOS-efi.img.gz --work $RUNNER_TEMP/slim"
          ARGS="$ARGS --openclash-apk openclash.apk --ddns-go-tar ddns-go.tar.gz"
          ARGS="$ARGS --build-stamp $STAMP"
          if [ "$USE_OAF_V7" = "true" ]; then ARGS="$ARGS --oaf-dir files/oaf"; fi
          eval python3 recipe/build.py $ARGS
          ls -lh iStoreOS-efi.img.gz*
          echo "upstream=$(cat upstream.name 2>/dev/null || echo 自动探测)" >> "$GITHUB_OUTPUT"

      - name: 生成 OTA 清单（让设备上的 OTA 指向本仓库）
        run: |
          set -e
          # 上游版本（设备上原来的版本就是它，用来让检查逻辑停下）
          if [ -f upstream.name ]; then
            UP=$(sed -nE 's/^istoreos-([0-9.]+)-([0-9]+)-.*/\1-\2/p' upstream.name)
          else
            UP=$(basename "${{ inputs.upstream_url }}" | sed -nE 's/^istoreos-([0-9.]+)-([0-9]+)-.*/\1-\2/p')
          fi
          [ -n "$UP" ] || UP="unknown-$(date +%Y%m%d)"
          REL="${UP%-*}"                       # 25.12.5（上游换版本时自动跟着变）
          VER="$REL-$STAMP"
          IMG=iStoreOS-efi.img.gz
          SHA=$(cut -d' ' -f1 $IMG.sha256)
          printf '[%s](%s)\nSHA256: %s\n' "$VER" "$IMG" "$SHA" > version.latest.v2
          { echo "$VER"; [ "$UP" = "$VER" ] || echo "$UP"; } > version.index.v2
          printf '%s\n' "$UP" > upstream.ver
          echo "--- version.latest.v2 ---"; cat version.latest.v2
          echo "--- version.index.v2 ---"; cat version.index.v2
          echo "--- upstream.ver ---"; cat upstream.ver

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-efi
          path: |
            iStoreOS-efi.img.gz
            iStoreOS-efi.img.gz.sha256
            version.latest.v2
            version.index.v2
            upstream.ver
          retention-days: 14

      - name: 发布 Release
        if: ${{ env.MAKE_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: iStoreOS 精简版 #${{ github.run_number }}
          body: |
            从官方镜像自动精简而来。

            - 上游镜像: ${{ steps.build.outputs.upstream }}
            - OpenClash: ${{ env.OPENCLASH_VERSION }}
            - DDNS-GO: ${{ env.DDNS_GO_VERSION }}
            - 默认网络: LAN=10.0.0.1；双网口=第一口 WAN、第二口 LAN；开机自检自动修正网口残留

            **刷写方法**：系统 → 备份/刷写固件，选这个 `img.gz`（在线升级，配置与已装插件都会保留）。
            新装机用 balenaEtcher 或 `gunzip -c xxx.img.gz | sudo dd of=/dev/sdX bs=4M conv=fsync`。
          files: |
            iStoreOS-efi.img.gz
            iStoreOS-efi.img.gz.sha256
            version.latest.v2
            version.index.v2
            upstream.ver

      - name: 只保留最新一个 Release
        if: ${{ env.MAKE_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "保留最新，删除更早的 Release（含 tag）："
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].tagName' | while read -r t; do
            [ -n "$t" ] || continue
            echo "  - 删除 $t"
            gh release delete "$t" --yes --cleanup-tag || true
          done
